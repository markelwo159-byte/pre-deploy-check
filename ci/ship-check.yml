# Copy to .github/workflows/ship-check.yml in a project to run the gate on every push.
name: ship-check
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools
        run: |
          pip install pytest pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Fetch ship-check
        run: curl -fsSL https://raw.githubusercontent.com/markelwo159-byte/ship-check/main/ship-check.sh -o ship-check.sh && chmod +x ship-check.sh
      - name: Run gate
        run: ./ship-check.sh . --report ship-check-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ship-check-report
          path: ship-check-report.md
