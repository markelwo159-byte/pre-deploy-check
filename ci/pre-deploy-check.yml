# Copy to .github/workflows/pre-deploy-check.yml in a project to run the gate on every push.
name: pre-deploy-check
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools
        run: |
          pip install pytest pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Fetch pre-deploy-check
        run: curl -fsSL https://raw.githubusercontent.com/markelwo159-byte/pre-deploy-check/main/pre-deploy-check.sh -o pre-deploy-check.sh && chmod +x pre-deploy-check.sh
      - name: Run gate
        run: ./pre-deploy-check.sh . --report pre-deploy-check-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-deploy-check-report
          path: pre-deploy-check-report.md
